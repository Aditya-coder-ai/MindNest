version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mindnest-postgres
    environment:
      POSTGRES_USER: mindnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindnest-dev}
      POSTGRES_DB: mindnest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindnest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindnest-network

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: mindnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindnest-network

  # MindNest AI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindnest-api
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DATABASE_URL: postgresql://mindnest:${POSTGRES_PASSWORD:-mindnest-dev}@postgres:5432/mindnest
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./instance:/app/instance
    networks:
      - mindnest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mindnest-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - mindnest-network

volumes:
  postgres_data:
  redis_data:

networks:
  mindnest-network:
    driver: bridge
